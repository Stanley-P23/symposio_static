<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zmiana Sali</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .graffiti-container {
            position: relative;
            text-align: center;
        }

        .graffiti-text {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 5em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            position: relative;
            display: inline-block;
            color: #fff;
            text-shadow:
                3px 3px 0 #ff006e,
                6px 6px 0 #8338ec,
                9px 9px 0 #3a86ff,
                12px 12px 20px rgba(0, 0, 0, 0.8);
            transform: skew(-5deg);
            animation: pulse 2s ease-in-out infinite;
        }

        .graffiti-text::before {
            content: 'ZMIANA SALI:';
            position: absolute;
            top: 0;
            left: 0;
            color: transparent;
            -webkit-text-stroke: 2px #ffbe0b;
            z-index: -1;
            transform: translate(-3px, -3px);
        }

        .sala-number {
            display: block;
            font-size: 1.5em;
            margin-top: 10px;
            color: #ffbe0b;
            text-shadow:
                2px 2px 0 #ff006e,
                4px 4px 0 #8338ec,
                6px 6px 15px rgba(0, 0, 0, 0.8);
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0%, 100% {
                transform: skew(-5deg) scale(1);
            }
            50% {
                transform: skew(-5deg) scale(1.05);
            }
        }

        @keyframes glow {
            from {
                text-shadow:
                    2px 2px 0 #ff006e,
                    4px 4px 0 #8338ec,
                    6px 6px 15px rgba(255, 190, 11, 0.5);
            }
            to {
                text-shadow:
                    2px 2px 0 #ff006e,
                    4px 4px 0 #8338ec,
                    6px 6px 30px rgba(255, 190, 11, 1),
                    0 0 40px rgba(255, 190, 11, 0.8);
            }
        }

        .spray-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0.3;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 190, 11, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(131, 56, 236, 0.3) 0%, transparent 50%);
        }

        @media (max-width: 768px) {
            .graffiti-text {
                font-size: 3em;
                letter-spacing: 3px;
            }
            .sala-number {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body  onclick="window.location.href='matura.html';" style="cursor: pointer;">
    <a href="matura.html"><div class="graffiti-container">
        <div class="spray-effect"></div>
        <div class="graffiti-text">
            ZMIANA SALI:
            <span class="sala-number">SALA 16</span>
        </div>
    </div></a>
</body>
</html>
